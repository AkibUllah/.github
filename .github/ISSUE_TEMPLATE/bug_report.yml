name: Bug report
description: Something doesn't work the way the README says it should
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose up
        2. curl -X POST ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      render: shell
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
  - type: dropdown
    id: env
    attributes:
      label: How are you running it?
      options:
        - docker compose
        - local (venv / npm / go)
        - GitHub Codespaces
        - Render or another host
        - other
